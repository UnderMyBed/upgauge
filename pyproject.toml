[project]
name = "upguage-pipeline"
version = "0.1.0"
description = "Ingest pipeline for Upgauge — BTS T-100 Domestic Segment. Runs in CI only, never in prod."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
