name: Freshness

# CLAUDE.md's hard rule: "The cron must fail loudly. A broken ingest doesn't error -- the site
# keeps serving and DATA AS OF silently stops advancing. Alert when max(year_month) hasn't moved
# in ~45 days."
#
# SEPARATE FROM warehouse.yml ON PURPOSE. A check bolted onto that workflow cannot see it
# failing before the check runs, being disabled for repository inactivity, or being deleted --
# and `make ingest` exiting non-zero aborts that job several steps before any freshness step
# would be reached. An alert that shares a fate with the thing it watches is not an alert.
#
# Daily, not monthly: the threshold is 45 days, so a monthly check could report a 44-day-old
# stall as healthy and then not look again for another 30. Daily is free on a public repo, and
# the whole job is one API call plus a stdlib script.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: >-
          Override "now" (ISO 8601, e.g. 2027-01-01T00:00:00Z). Blank uses the real clock.
          This is how the alert is demonstrated firing: the release history, the comparison and
          the issue are all real, and only the clock is varied.
        required: false
        default: ""

permissions:
  contents: read   # gh release list
  issues: write    # file the alert

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `uv sync`: freshness.py is deliberately stdlib-only, so this needs an interpreter and
      # nothing else. mise rather than the runner's system python3 keeps it on the same 3.12.12
      # the tests pinned it against.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # `--exclude-drafts` is belt; the script's own publishedAt filter is braces (a draft
      # carries publishedAt=null). Same doubling as warehouse.yml's tag resolver, and for the
      # same reason: this consumer must not depend on a flag staying passed.
      #
      # `$releases` and `$FRESHNESS_NOW` reach the script as quoted variable expansions, never
      # spliced through `${{ }}` into the script text -- the rule warehouse.yml's PREVIOUS_TAG
      # and ISSUE_BODY comments spell out. `as_of` is dispatch-supplied text in a job holding
      # issues:write, so it goes through `env:` like every other untrusted value here.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHNESS_NOW: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          # RETRIED, because the watcher must not go quiet on someone else's outage. Measured
          # 2026-08-17: `gh release list` returned 503 five times inside one hour -- twice from a
          # workstation, twice in ci.yml's `resolve` (which skips every downstream gate when it
          # fails), and once in this workflow's own first live run, which is how this was found.
          #
          # An unretried failure costs a day of coverage, and a failed scheduled run is exactly
          # the signal nobody watches (#61) -- the watcher failing the way it exists to detect.
          releases=""
          for attempt in 1 2 3 4 5; do
            if releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                            --exclude-drafts --exclude-pre-releases \
                            --json tagName,publishedAt); then
              break
            fi
            echo "::warning::gh release list failed (attempt $attempt of 5); retrying"
            releases=""
            sleep $((attempt * 5))
          done
          # NEVER let a failed listing through as empty. `assess([])` is a STALE verdict with its
          # own cause, so an empty string here files a FALSE critical alert -- a watcher that
          # cries wolf over an API wobble is one that gets muted before the real event. `[]` is a
          # different thing entirely (a repo with no releases yet, a legitimate answer) and still
          # reaches the script; only an outright failure stops here.
          [ -n "$releases" ] || {
            echo "::error::could not list releases after 5 attempts -- refusing to evaluate freshness against no data"
            exit 1
          }
          mise exec -- python .github/scripts/freshness.py "$releases"

      # Staleness is a CONDITION, not an event: it stays true every day until someone fixes it.
      # Without this check a three-month stall files ninety issues, and an alert that buries its
      # own repeat is an alert that gets muted.
      - id: existing
        if: steps.check.outputs.file_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --label stale-data --json number --jq 'length')
          echo "count=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "::notice::a stale-data alert is already open; not filing another"

      # `stale-data` is the dedupe key and must exist on the repository -- `gh issue create`
      # fails outright on an unknown label, which would turn the alert into a failed run whose
      # only symptom is a red tick nobody is watching for. `critical` matches the severity
      # convention warehouse.yml's drift issue already uses.
      # FILING AN ISSUE IS NOT ALERTING A HUMAN, and this repo learned the difference by
      # shipping the gap. Measured 2026-08-17, right after the alert was demonstrated firing:
      # UnderMyBed/upguage was absent from the owner's six watched repositories,
      # `repos/.../subscription` returned 404, and the issue the demonstration filed (#64) was
      # authored by github-actions[bot] with ZERO assignees and no `@` anywhere in its body. An
      # issue opened by a bot, in an unwatched repo, that neither assigns nor mentions anyone,
      # notifies NOBODY. The alert worked perfectly and reached no one, which is the dark-guard
      # failure one level up from the one this workflow exists to prevent.
      #
      # The mention and the assignment both notify regardless of watch state, and both live HERE
      # rather than in account settings -- watching is correct today, silently revocable, and
      # invisible to every gate in this repo, the same objection hosting.md raises about
      # correctness that lives only in a provider's dashboard.
      #
      # OWNER goes through `env:` like every other expression in this file; see the `as_of`
      # comment above for why that is not judged per value.
      - name: File the freshness alert
        if: steps.check.outputs.file_issue == '1' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n\n%s' "@$OWNER" "$ISSUE_BODY")
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Data is stale: max(year_month) has not advanced" \
            --label critical --label stale-data \
            --body "$body")
          echo "::notice::filed $url"
          # Assignment is delivery polish ON TOP of an issue that already exists and already
          # mentions the owner -- so it is deliberately NOT `--assignee` on the create above. A
          # permissions or API hiccup there would fail the CREATE and lose the alert entirely,
          # which is strictly worse than the unassigned issue this replaces. Create first, assign
          # second, and let the assign fail loudly without taking the alert with it.
          gh issue edit "$url" --add-assignee "$OWNER" \
            || echo "::warning::could not assign $OWNER -- the @mention in the body is the fallback"
