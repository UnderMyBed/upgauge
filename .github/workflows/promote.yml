name: Promote

# The promote hop (D5). Nothing here reaches the box: this moves `:deploy` in the registry and
# nothing else, and the box's own timer notices within 30s. That is what lets "no inbound ports"
# and "a human decides when" hold at the same time -- and it makes ROLLBACK the same operation
# with an older tag, so the emergency path is the one that gets exercised every deploy.
#
# THIS WORKFLOW'S EXIT CODE MEANS "THE RETAG WENT THROUGH", NEVER "THE DEPLOY IS SERVING". It
# does not read the site: Bot Fight Mode serves a GitHub runner a challenge page, so a health
# check from here measures nothing (docs/architecture/deploy.md). Detecting a bad promote is
# `make promote`'s job, run from the operator's machine: it dispatches this workflow, and once
# the retag has gone through it confirms the promoted build under `ok` on `/api/health`.
# A bare `gh workflow run promote.yml` must be followed by that check by hand (deploy.md,
# Promote).
#
# The detector matters because of what the box does with a new `:deploy` digest:
# `deploy/upgauge-deploy.service`'s `docker compose up -d --wait` RECREATES the running
# container, stopping the old healthy one BEFORE the new one is confirmed healthy. An image that
# pulls but fails its healthcheck therefore takes the site DOWN, and the box's 30s timer just
# keeps retrying the same failing image forever -- it never reverts on its own. That was accepted
# deliberately (every image is gated by `make image-smoke` before it can reach the registry at
# all, and blue/green on a 4 GB box isn't worth it for ~12 deploys a year), which is exactly
# what makes `make promote`'s confirmation the thing that DETECTS a bad promote, and promoting
# the previous known-good tag the REMEDY.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable tag to promote, e.g. warehouse-2026.05-9a9511d"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `.github/scripts/promote_check.py` and its `gha.py` helper must be present on the
      # runner -- the validate step calls them, unlike the re-tag step, which needs only
      # `docker`.
      - uses: actions/checkout@v7

      # No `uv sync`: promote_check.py is deliberately stdlib-only (same reasoning as
      # freshness.py), so this needs an interpreter pinned to the version this repo tests
      # against and nothing else.
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # Fast-fail on a typo'd tag. A tag that is not the `warehouse-YYYY.MM-<sha>` shape
      # `image.yml` publishes was never a real image; an operator who fat-fingered `-f tag=`
      # deserves that answer in seconds, named as a typo, rather than after a login and five
      # retried registry round trips that end in "does not exist". `--validate` is an explicit
      # flag; see `promote_check.py`'s `main()`.
      - name: Validate the tag's shape before touching the registry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mise exec -- python .github/scripts/promote_check.py --validate "$TAG"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # imagetools re-tags by DIGEST without pulling 413 MB. The source tag must already
      # exist; `image.yml` is what vouched for it.
      #
      # Both calls are registry network requests, retried for the same reason every `gh` call
      # elsewhere in this repo is (freshness.yml's release listing 503'd five times in one hour
      # on 2026-08-17): a transient failure here must not be read as "the tag does not exist",
      # and must not silently abandon a promote that was otherwise fine.
      - name: Point :deploy at the requested digest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          src="ghcr.io/undermybed/upguage:${TAG}"

          digest=""
          for attempt in 1 2 3 4 5; do
            if digest=$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}' 2>/tmp/inspect.err); then
              break
            fi
            digest=""
            echo "::warning::imagetools inspect $src failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 5))
          done
          [ -n "$digest" ] || {
            cat /tmp/inspect.err >&2
            echo "::error::$src does not exist or could not be inspected after 5 attempts -- image.yml is what publishes it; confirm the tag"
            exit 1
          }

          created=""
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create -t ghcr.io/undermybed/upguage:deploy "$src"; then
              created=1
              break
            fi
            echo "::warning::imagetools create :deploy failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 5))
          done
          [ -n "$created" ] || {
            echo "::error::could not point :deploy at $src after 5 attempts -- the source tag exists but the re-tag itself did not go through"
            exit 1
          }

          echo "::notice::promoted $src ($digest)"
          echo "### Promoted \`$src\` ($digest)" >> "$GITHUB_STEP_SUMMARY"
          echo "The retag went through. Whether the box is serving it is not measured here -- \`make promote\` confirms it, or check by hand (docs/architecture/deploy.md, Promote)." >> "$GITHUB_STEP_SUMMARY"
