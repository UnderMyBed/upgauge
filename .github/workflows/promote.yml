name: Promote

# The promote hop (D5). Nothing here reaches the box: this moves a tag in the registry, and
# the box's own timer notices within 30s. That is what lets "no inbound ports" and "a human
# decides when" hold at the same time -- and it makes ROLLBACK the same operation with an
# older tag, so the emergency path is the one that gets exercised every deploy.
#
# What the box does with a new `:deploy` digest is itself a hazard this workflow exists to
# catch, not just describe: `deploy/upgauge-deploy.service`'s `docker compose up -d --wait`
# RECREATES the running container, stopping the old healthy one BEFORE the new one is confirmed
# healthy. An image that pulls but fails its healthcheck therefore takes the site DOWN, and the
# box's 30s timer just keeps retrying the same failing image forever -- it never reverts on its
# own. That was accepted deliberately (every image is gated by `make image-smoke` before it can
# reach the registry at all, and blue/green on a 4 GB box isn't worth it for ~12 deploys a
# year), which is exactly what makes the "Wait for the box to be serving it" step below the
# thing that DETECTS a bad promote, and re-dispatching this same workflow with the previous
# known-good tag the REMEDY. See that step's failure message.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable tag to promote, e.g. warehouse-2026.05-9a9511d"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `.github/scripts/promote_check.py` and its `gha.py` helper must be present on the
      # runner -- this job calls them below, unlike the pure re-tag steps, which need only
      # `docker`.
      - uses: actions/checkout@v7

      # No `uv sync`: promote_check.py is deliberately stdlib-only (same reasoning as
      # freshness.py), so this needs an interpreter pinned to the version this repo tests
      # against and nothing else.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Fast-fail on a typo'd tag. `promote_check.py`'s `assess()` already reports this exact
      # failure from inside the poll loop below, but only after the loop's full 30-attempt/300s
      # budget elapses -- an operator who fat-fingered `-f tag=` deserves an answer in seconds,
      # not five minutes, and shouldn't have to wait through a login and a registry round trip
      # first either. Single positional argument (no health report) is `promote_check.py`'s
      # validate-only call shape; see its `main()` docstring.
      - name: Validate the tag's shape before polling
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mise exec -- python .github/scripts/promote_check.py "$TAG"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # imagetools re-tags by DIGEST without pulling 413 MB. The source tag must already
      # exist; `image.yml` is what vouched for it.
      #
      # Both calls are registry network requests, retried for the same reason every `gh` call
      # elsewhere in this repo is (freshness.yml's release listing 503'd five times in one hour
      # on 2026-08-17): a transient failure here must not be read as "the tag does not exist",
      # and must not silently abandon a promote that was otherwise fine.
      - name: Point :deploy at the requested digest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          src="ghcr.io/undermybed/upguage:${TAG}"

          digest=""
          for attempt in 1 2 3 4 5; do
            if digest=$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}' 2>/tmp/inspect.err); then
              break
            fi
            digest=""
            echo "::warning::imagetools inspect $src failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 5))
          done
          [ -n "$digest" ] || {
            cat /tmp/inspect.err >&2
            echo "::error::$src does not exist or could not be inspected after 5 attempts -- image.yml is what publishes it; confirm the tag"
            exit 1
          }

          created=""
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create -t ghcr.io/undermybed/upguage:deploy "$src"; then
              created=1
              break
            fi
            echo "::warning::imagetools create :deploy failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 5))
          done
          [ -n "$created" ] || {
            echo "::error::could not point :deploy at $src after 5 attempts -- the source tag exists but the re-tag itself did not go through"
            exit 1
          }

          echo "::notice::promoted $src ($digest)"
          echo "### Promoted \`$src\` ($digest)" >> "$GITHUB_STEP_SUMMARY"

      # The deploy's own proof. Without this the workflow reports success for having moved a
      # tag, which is not the thing anyone wanted done -- the box could be down, the timer
      # stopped, or the image unable to start, and this would still be green.
      #
      # The tag-parsing half of the comparison lives in `.github/scripts/promote_check.py`, not
      # here -- see that module's docstring for the bash last-dash-splitting bug it exists to
      # avoid (breaks on a `-dirty` sha). `TAG` reaches the script only as an argv value under
      # `env:`, never spliced through `${{ }}` into this script's text.
      #
      # A `curl` failure reads as "not yet" deliberately: this loop already retries every 10s
      # for up to 5 minutes, so a single dropped connection must not abort the whole workflow --
      # the SAME "never treat a failure as an empty answer" rule other workflows apply to `gh`
      # calls means something different in a loop that is ALREADY the retry: it is the FINAL
      # verdict after every attempt is exhausted that must not be silently swallowed, and it
      # isn't.
      #
      # THE STATUS IS MEASURED, NOT ONLY THE BODY, and the final verdict comes from
      # `promote_check.py --exhausted` rather than a bare `echo` here. This step used to emit
      # "The tag moved; the deploy did not" and "ROLL BACK NOW" unconditionally; on 2026-08-1x
      # it emitted both against a healthy, correctly-promoted deploy, because all 30 attempts
      # had been served a challenge page and the workflow had never read the box at all. A
      # message hardcoded in bash cannot be conditional on the evidence, and a rollback is a real
      # production action -- so the decision lives with the rest of the decisions, in the script.
      # See its `exhausted_report` for which verdict earns the rollback and which does not.
      # 30 attempts x 10s = 300s budget. Where that number comes from, and what part of it is
      # actually measured:
      #
      #   MEASURED (read straight from the committed config, not guessed):
      #     - deploy/upgauge-deploy.timer: OnUnitActiveSec=30s -- the box's timer fires at most
      #       every 30s, so a promote landing right after a tick can wait up to ~30s before the
      #       NEXT tick even notices the digest moved.
      #     - deploy/compose.yml / Dockerfile HEALTHCHECK: start_period=20s, interval=30s -- the
      #       container's healthcheck doesn't count a failure during the first 20s, and the
      #       first check fires at the ~30s interval mark, so a freshly-started container is
      #       realistically confirmed healthy on the order of 30-50s after `compose up` returns.
      #     - deploy/upgauge-deploy.sh: `docker compose pull --quiet app` runs unconditionally
      #       every tick, THEN `docker compose up -d --wait` gates on the healthcheck above.
      #
      #   NOT MEASURED, because no live box exists yet (Task 6) -- an assumption, not a fact:
      #     - how long `docker compose pull` actually takes to pull a ~413 MB image layer set
      #       over this box's real network. Anywhere from single-digit seconds (mostly-cached
      #       layers) to tens of seconds is plausible; there is no measurement behind that range.
      #
      # Summing the measured parts alone (up to ~30s timer latency + ~30-50s healthcheck
      # confirmation) plus a guessed pull time lands around 60-100s of overhead against this
      # step's 300s budget -- comfortable margin IF the guessed part holds, unverified until it
      # can be timed against the real box (brief Step 5's rollback drill is where that happens).
      - name: Wait for the box to be serving it
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          code=000
          body=''
          # The last attempt that actually READ a build, kept separately: `code`/`body` are
          # overwritten every iteration, so one flaky sample at attempt 30 would otherwise
          # decide a verdict about all 30 -- and would downgrade an earned rollback order to
          # the conditional blind path. Exit status 2 from the poll is what marks such an
          # attempt; see promote_check.py's main() for the three-way contract.
          seen_code=''
          seen_body=''
          for attempt in $(seq 1 30); do
            # Truncated first, so a fetch that fails part-way is never read as the PREVIOUS
            # attempt's body. 8000 bytes is far above any real report (~150) and bounds what a
            # broken origin can put into argv.
            : > /tmp/health.body
            # NOT `$(curl ... || echo 000)`: curl writes its `-w` output even when the transfer
            # fails, so the fallback CONCATENATES onto it. Measured with curl 8.18.0: `000000`
            # on a refused connection, and `200000` when --max-time expires mid-body -- which
            # then prints as `HTTP 200000`. Assign in the failure branch instead.
            if ! code=$(curl -sS -o /tmp/health.body -w '%{http_code}' --max-time 10 \
                        https://upgauge.shipman.dev/api/health); then
              code=000
            fi
            body=$(head -c 8000 /tmp/health.body)
            echo "attempt ${attempt}:"
            rc=0
            mise exec -- python .github/scripts/promote_check.py "$TAG" "$code" "$body" || rc=$?
            if [ "$rc" = 0 ]; then
              printf '%s' "$body" | jq . >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$rc" = 2 ]; then
              seen_code=$code
              seen_body=$body
            fi
            sleep 10
          done
          # Writes its own `::error::` lines and its own step summary, then exits 1. The bare
          # `exit 1` under it is the backstop that keeps this step failing even if that ever
          # stops being true.
          mise exec -- python .github/scripts/promote_check.py \
            --exhausted "$TAG" "${seen_code:-$code}" "${seen_body:-$body}" "$attempt"
          exit 1
