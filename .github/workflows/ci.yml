name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref. A superseded push should not keep burning a 5-minute smoke.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolves ONE tag for the whole run. Required for correctness, not tidiness: the warehouse
  # is deliberately unpinned (see the spec's D3), so a publish landing mid-run would otherwise
  # let `check` resolve tag N while `smoke` resolves N+1 -- one run reporting on two datasets.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                  --json tagName,createdAt \
                  --jq '[.[] | select(.tagName | startswith("warehouse-"))]
                        | sort_by(.createdAt) | reverse | .[0].tagName')
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::no warehouse-* release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Warehouse \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          warehouse-tag: ${{ needs.resolve.outputs.tag }}
      - name: make check
        env:
          # -rs prints WHY each test skipped, so the guard below can read reasons, not just
          # a count. Without it pytest's quiet summary line hides the "no built catalog" /
          # "no built Parquet warehouse" text this job needs to grep for.
          PYTEST_ADDOPTS: -rs
        run: |
          set -euo pipefail
          make check 2>&1 | tee /tmp/check.log
          # This job restores upgauge.duckdb + data/parquet but never data/raw (restore-raw
          # defaults to "false" -- only `make verify` pays for that 136 MB). Real-data tests
          # gated on data/raw (test_invariants_against_real_data.py, test_city_market.py,
          # test_reproducibility.py's byte-identical-on-a-real-extract case) skip HERE BY
          # DESIGN, same as on a fresh clone -- their own docstrings say so. A silently broken
          # warehouse restore looks different: it skips tests gated on `upgauge.duckdb` or
          # `data/parquet` existing, whose skip reasons say "no built catalog" or "no built
          # Parquet warehouse". Only THOSE reasons mean the restore failed; grepping for any
          # skip at all would make this job permanently red by design, not just when broken.
          if grep -qE 'no built catalog|no built Parquet warehouse' /tmp/check.log; then
            echo "::error::tests were skipped for a MISSING WAREHOUSE reason with a warehouse present -- restore is broken"
            exit 1
          fi

  # Answers one question, cheaply and first: is the restored warehouse the one this commit's
  # reference values describe? When this is red, every other red in the run is explained by
  # it. Deliberately NOT a dependency of the gate jobs -- they must still run, so their
  # failures can be read as consequences rather than mysteries.
  data-contract:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          warehouse-tag: ${{ needs.resolve.outputs.tag }}
      # `make stats` and the diff check are ONE step on purpose. GitHub skips subsequent steps
      # once a step fails, so if these were split (as they originally were) a `make stats`
      # crash -- which is the failure mode this job exists to catch, e.g. a BTS refresh
      # renaming a column that `stats_reference.sql` still references -- would never reach the
      # framing text below. The reader would get a bare red step and a raw traceback instead of
      # "this is a structural upstream change, other reds are consequences". Folding them into
      # one step means both failure modes -- `make stats` erroring, and it succeeding but
      # disagreeing with what's committed -- run the same summary-writing code.
      - name: Regenerate the reference values and assert they match what is committed
        run: |
          set -euo pipefail
          if ! make stats; then
            {
              echo "## Data contract FAILED"
              echo
              echo "\`make stats\` itself failed while regenerating the reference values --"
              echo "it never got as far as producing JSON to diff."
              echo "**This usually means a STRUCTURAL upstream change** (a renamed or dropped"
              echo "column, a mart whose shape no longer matches \`stats_reference.sql\`) --"
              echo "not just numbers moving. **Any other failing job in this run is most"
              echo "likely a consequence of this.**"
              echo
              echo "Fix: run \`make stats\` locally, read the traceback, and update the SQL or"
              echo "pipeline to match the new shape, then re-pin the reference values in the"
              echo "same commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          diff_output="$(git diff -- pipeline/reference/stats.generated.json)"
          if [ -n "$diff_output" ]; then
            {
              echo "## Data contract FAILED"
              echo
              echo "The upstream dataset does not match this commit's reference values."
              echo "**Any other failing job in this run is most likely a consequence of this.**"
              echo
              echo "Fix: run \`make stats\`, read the diff, and re-pin whatever depended on the"
              echo "old values in the same commit."
              echo
              echo '```diff'
              echo "$diff_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Data contract ok — warehouse matches committed reference values" >> "$GITHUB_STEP_SUMMARY"

  app-check:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          warehouse-tag: ${{ needs.resolve.outputs.tag }}
      # 349 of these 781 fail without a built upgauge.duckdb, and 16 of 50 test files open
      # the real database and assert real measured values. The setup action's presence
      # assertion is what stops that becoming a confusing mass failure.
      - run: make app-check

  goldens:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          warehouse-tag: ${{ needs.resolve.outputs.tag }}
      - name: Regenerate the Explorer contract fixtures
        run: make goldens
      - name: Assert they are byte-identical
        run: git diff --exit-code -- sql/03_queries/goldens/
