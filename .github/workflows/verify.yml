name: Verify (reproducibility)

on:
  schedule:
    - cron: "17 4 * * *"   # nightly, off-peak; no upstream schedule to align to
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Same query as warehouse.yml's `previous` step, whose comment is the ONLY place the
      # three-way divergence is written down -- read it before editing this. In short:
      # publishedAt not createdAt (createdAt comes from the tag's COMMIT, so releases off an
      # unchanged main tie and a reverse-sort picks the older one), and the tag shape is
      # validated here on the consumer side, not merely prefix-matched. Strict, unlike
      # warehouse.yml: a nightly reproducibility proof with no warehouse proves nothing.
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                  --exclude-drafts --exclude-pre-releases \
                  --json tagName,publishedAt \
                  --jq '[.[] | select(.publishedAt != null)
                             | select(.tagName | test("^warehouse-[0-9]{4}\\.[0-9]{2}$"))]
                        | sort_by(.publishedAt, .tagName) | last | .tagName // ""')
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::no published warehouse-YYYY.MM release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          warehouse-tag: ${{ steps.pick.outputs.tag }}
          restore-raw: "true"
      # #61: `data-contract` lived ONLY in ci.yml, which triggers on pull_request and
      # push:main -- so the gate whose entire purpose is catching the upstream dataset moving
      # was gated behind a human opening a PR, while the dataset moves on BTS's schedule.
      # Measured: warehouse-2026.05 published 2026-08-14 and the first CI run to notice was an
      # unrelated PR on 2026-08-17, three nights later.
      #
      # HERE rather than on a schedule added to ci.yml, for a concrete reason: ci.yml's
      # concurrency group is `ci-${{ github.ref }}` with cancel-in-progress, which a scheduled
      # run on main would SHARE with a push to main -- the two would cancel each other. That is
      # a new failure mode in the workflow whose reds we are trying to make reliable. This job
      # already resolves the newest release and already restores the warehouse, so covering the
      # same assertion here costs one `make stats`.
      #
      # FIRST, before `make check` and `make verify`. An ordering, not a preference: `make
      # verify` rebuilds the warehouse twice under a 60-minute timeout, and running it against
      # reference values already known to be stale spends an hour to learn nothing. The
      # tradeoff is deliberate -- if the dataset moved AND reproducibility broke, tonight only
      # reports the first. The re-pin is a prerequisite for the second result meaning anything.
      - name: Data contract (the assertion ci.yml only makes when a human opens a PR)
        run: |
          set -euo pipefail
          if ! make stats; then
            {
              echo "## Data contract FAILED (nightly)"
              echo
              echo "\`make stats\` itself failed while regenerating the reference values --"
              echo "it never got as far as producing JSON to diff. **This usually means a"
              echo "STRUCTURAL upstream change** (a renamed or dropped column, a mart whose"
              echo "shape no longer matches \`stats_reference.sql\`), not just numbers moving."
              echo "**Any other failure in this run is most likely a consequence of this.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          diff_output="$(git diff -- pipeline/reference/stats.generated.json)"
          if [ -n "$diff_output" ]; then
            {
              echo "## Data contract FAILED (nightly)"
              echo
              echo "The upstream dataset no longer matches this commit's reference values --"
              echo "BTS published, and this repository's pins have not followed."
              echo "**Any other failure in this run is most likely a consequence of this.**"
              echo
              echo "Fix: run \`make stats\`, read the diff, and re-pin whatever depended on"
              echo "the old values in the same commit."
              echo
              echo '```diff'
              echo "$diff_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Data contract ok — warehouse matches committed reference values" >> "$GITHUB_STEP_SUMMARY"

      # This job is the ONLY place the raw-dependent tests run. The per-PR `check` job restores
      # no `data/raw/`, so 15 real-data invariant tests skip there by design -- including
      # test_quarantine_stays_rare_on_real_data and the distance-variance bound. Running
      # `make check` here, where raw IS restored, is what stops them being dark everywhere.
      # Report which gate failed: a bare nightly red is ambiguous between the two.
      - name: make check (the raw-dependent tests, which run nowhere else)
        env:
          # -rs prints WHY each test skipped. Without it, pytest's `-q` summary (this repo's
          # default addopts) never prints skip reasons anywhere in the log -- confirmed by
          # running the mutant: a plain `-q` skip of a test reasoned "no 2015 extract..."
          # produces only an `s` and a bare count, so the grep below would never match and
          # this guard would be vacuous exactly in the failure mode it exists to catch.
          PYTEST_ADDOPTS: -rs
        run: |
          set -euo pipefail
          make check 2>&1 | tee /tmp/check-nightly.log
          if grep -qE 'no 2015 extract|no Master Coordinate|no real extract' /tmp/check-nightly.log; then
            echo "::error::raw-dependent tests SKIPPED in the one job that restores raw -- the raw restore is broken"
            exit 1
          fi

      - name: make verify
        run: |
          set -euo pipefail
          make verify 2>&1 | tee /tmp/verify.log
      - name: Summarise
        if: always()
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          # `if: always()`, so this runs even when an earlier gate short-circuited the job --
          # and since the data contract now runs FIRST, /tmp/verify.log legitimately does not
          # exist on those runs, because `make verify` never started. Reading it unguarded made
          # this step fail for a SECOND, misleading reason (`tail: cannot open`), turning one
          # clear red into two on the job whose whole value is an unambiguous red. Measured on
          # the #61 demonstration run 32106834513, 2026-08-18.
          {
            echo "## make verify on \`$TAG\`"
            echo
            if [ -f /tmp/verify.log ]; then
              echo '```'
              grep -E 'artifacts|objects|basemap' /tmp/verify.log || tail -20 /tmp/verify.log
              echo '```'
            else
              echo "\`make verify\` never ran: an earlier gate failed and wrote its own"
              echo "summary above. That summary is the finding; this section is not."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
