name: Warehouse

on:
  # BTS publishes monthly with a 2-3 month lag and NO published day-of-month schedule
  # (transtats releaseinfo.asp records dates only after the fact), so this polls rather than
  # firing on a calendar date. Daily is free on a public repo.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write        # create releases
  id-token: write        # provenance attestation
  attestations: write
  issues: write          # Task 11 files drift issues

# A manual dispatch overlapping the daily cron would run `make ingest` twice in parallel
# against BTS -- contradicting the whole citizenship rationale below. Tag uniqueness already
# stops a duplicate release object, so this is about wasted compute and a failed run, not a
# duplicate publish -- never cancel a run that may be mid-publish.
concurrency:
  group: warehouse
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: mise exec -- uv sync --extra dev

      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                  --json tagName,createdAt \
                  --jq '[.[] | select(.tagName | startswith("warehouse-"))]
                        | sort_by(.createdAt) | reverse | .[0].tagName')
          # Tolerant, not strict: an empty tag is a VALID state here (first-ever run), so this
          # normalizes the literal string "null" jq/gh can emit -- it does not exit 1 on empty,
          # unlike ci.yml/verify.yml's `pick` step, which requires a warehouse to already exist.
          [ "$tag" = "null" ] && tag=""
          echo "tag=${tag:-}" >> "$GITHUB_OUTPUT"

      # Restoring raw BEFORE fetching is what makes this incremental. The fetcher's cache is
      # keyed (table, year) on the filesystem, so without this every run re-drives 12 years of
      # TranStats POSTs -- slow, and poor citizenship toward a .gov endpoint.
      - name: Restore previous raw and warehouse
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.previous.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.tar.zst'
          for f in *.tar.zst; do tar --zstd -xf "$f"; done
          rm -f *.tar.zst
          cp upgauge.duckdb /tmp/previous.duckdb
          find data/raw -type f | wc -l

      - name: Ingest and build
        run: |
          set -euo pipefail
          make ingest
          make build

      # Emits all three names. `raw_name` is a separate output on purpose: GitHub Actions
      # expressions do NOT support bash parameter expansion, so `${{ steps.x.outputs.tag#pre }}`
      # would expand to nothing and silently produce a file called `.tar.zst`.
      - id: stamp
        run: |
          set -euo pipefail
          # sql/03_queries/data_as_of.sql already IS this query -- its own header says it
          # exists so nothing needs to inline one. Read and execute it rather than restating it.
          ym=$(mise exec -- uv run python -c "import duckdb; from pathlib import Path; sql = Path('sql/03_queries/data_as_of.sql').read_text(); print(duckdb.connect('upgauge.duckdb', read_only=True).execute(sql).fetchone()[0])")
          # A `make build` that exits 0 against an empty fct_segment_month makes `ym` the
          # string "None" (SQL NULL, printed by Python) -- and the size guard cannot catch
          # this, since the .duckdb stays well over 1MB from schema and dims alone. Refuse to
          # publish rather than mint a `warehouse-None` release that `resolve` could later pick.
          [[ "$ym" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "::error::max(year_month) is '$ym', not YYYY-MM -- refusing to publish"; exit 1; }
          dotted=${ym/-/.}
          echo "year_month=$ym" >> "$GITHUB_OUTPUT"
          echo "tag=warehouse-$dotted" >> "$GITHUB_OUTPUT"
          echo "raw_name=raw-$dotted" >> "$GITHUB_OUTPUT"

      - id: classify
        if: steps.previous.outputs.tag != ''
        run: |
          set -euo pipefail
          make stats
          cur=$(cat pipeline/reference/stats.generated.json)
          prev=$(mise exec -- uv run python -c "
          import duckdb, json, sys
          sys.path.insert(0, '.')
          from pipeline.stats import collect
          con = duckdb.connect('/tmp/previous.duckdb', read_only=True)
          print(json.dumps(collect(con)))
          ")
          mise exec -- uv run python .github/scripts/classify_warehouse.py "$prev" "$cur"

      - name: File a critical issue on a shape change
        if: steps.classify.outputs.file_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream data shape changed (${{ steps.stamp.outputs.year_month }})" \
            --label critical \
            --body "${{ steps.classify.outputs.issue_body }}"

      - name: Stop if this month is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.stamp.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${{ steps.stamp.outputs.tag }} already published; nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Pack the assets
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          tar --zstd -cf "${{ steps.stamp.outputs.tag }}.tar.zst" upgauge.duckdb data/parquet
          tar --zstd -cf "${{ steps.stamp.outputs.raw_name }}.tar.zst" data/raw
          ls -la *.tar.zst
          # Both assets must exist and be non-trivial. A zero-byte tarball published as a
          # release is worse than a failed run: CI would restore it and every gate would fail
          # for an unexplained reason.
          for f in *.tar.zst; do
            size=$(stat -c%s "$f")
            [ "$size" -gt 1000000 ] || { echo "::error::$f is only $size bytes"; exit 1; }
          done

      - name: Attest provenance
        if: env.SKIP != '1'
        # v4, not v1: this workflow is dispatch/cron only, so no PR gate will ever exercise a
        # Dependabot bump here the way one arrives (with a gate) for checkout/mise-action/cache.
        # Bump the actions CI cannot cover now; leave the CI-covered ones to Dependabot.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.tar.zst"

      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.stamp.outputs.tag }}" *.tar.zst \
            --repo "$GITHUB_REPOSITORY" \
            --title "Warehouse ${{ steps.stamp.outputs.year_month }}" \
            --notes "BTS T-100 warehouse through ${{ steps.stamp.outputs.year_month }}."
