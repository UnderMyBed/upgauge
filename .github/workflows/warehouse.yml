name: Warehouse

on:
  # BTS publishes monthly with a 2-3 month lag and NO published day-of-month schedule
  # (transtats releaseinfo.asp records dates only after the fact), so this polls rather than
  # firing on a calendar date. Daily is free on a public repo.
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write        # create releases
  id-token: write        # provenance attestation
  attestations: write
  issues: write          # Task 11 files drift issues

# A manual dispatch overlapping the daily cron would run `make ingest` twice in parallel
# against BTS -- contradicting the whole citizenship rationale below. Tag uniqueness already
# stops a duplicate release object, so this is about wasted compute and a failed run, not a
# duplicate publish -- never cancel a run that may be mid-publish.
concurrency:
  group: warehouse
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Read by `bump-pin` below. `published` is written by the `gh release create` step itself,
    # which already carries `if: env.SKIP != '1'` -- so on the ~30 days a month this workflow
    # polls BTS and finds nothing new, the value is never written and the bump job never runs.
    # An output set unconditionally would gate nothing.
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      published: ${{ steps.released.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - run: mise exec -- uv sync --extra dev

      # THE tag resolver. ci.yml's `pick` and verify.yml's `pick` are the same query with
      # deliberately different empty-handling (see the note below the command); this comment is
      # the one place the three-way divergence is explained -- both point here.
      #
      # sort_by(.publishedAt), NEVER .createdAt. GitHub stamps a release's `created_at` from its
      # TAG's commit, not from the release: `warehouse-2026.04` carries
      # created_at=2026-08-08T17:00:48Z, which is `main` HEAD's commit date to the second, while
      # published_at=2026-08-08T19:00:50Z. This repo's steady state is publishing off an
      # UNCHANGED main, so two releases a month apart carry IDENTICAL createdAt -- an exact tie.
      # `gh` lists newest-first and jq's `sort_by` is stable, so `sort_by | reverse | .[0]`
      # reverses a tie into the OLDER tag. Measured against a synthetic tie: the old form
      # returned warehouse-2026.05 with warehouse-2026.06 present. Ascending `sort_by | last`
      # with tagName as the tiebreak (shape-validated below, so it sorts chronologically) fixes
      # both the field and the tie.
      #
      # The shape regex is a CONSUMER-side check, not a restatement of the producer's `ym` guard:
      # `startswith("warehouse-")` constrains the PREFIX ONLY, and git ref names permit backticks,
      # `$`, `;`, `&`, `|`, quotes and parens. On a list containing a tag literally named
      # ``warehouse-`id` ``, the old form selected it; this one selects the well-formed tag.
      # Drafts have publishedAt=null, which would sort as the smallest value -- excluded twice,
      # by the gh flag and by the jq guard.
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                  --exclude-drafts --exclude-pre-releases \
                  --json tagName,publishedAt \
                  --jq '[.[] | select(.publishedAt != null)
                             | select(.tagName | test("^warehouse-[0-9]{4}\\.[0-9]{2}$"))]
                        | sort_by(.publishedAt, .tagName) | last | .tagName // ""')
          # Tolerant, not strict: an empty tag is a VALID state here (first-ever run). `// ""`
          # above already turns "no match" into an empty string; this normalizes the literal
          # "null" jq/gh can still emit. It does NOT exit 1 on empty, unlike ci.yml/verify.yml's
          # `pick`, which require a warehouse to already exist.
          [ "$tag" = "null" ] && tag=""
          echo "tag=${tag:-}" >> "$GITHUB_OUTPUT"

      # Restoring raw before fetching is a CACHE for the years BTS can no longer change, not the
      # mechanism that finds new data. `make ingest` re-downloads the current and previous year
      # unconditionally and always re-pulls the support tables (see the Makefile's `ingest`
      # comment for why: the fetch cache is keyed by YEAR, and a new BTS month lands inside an
      # already-downloaded year's zip). What this restore buys is the other ten years --
      # 2 TranStats year-pulls per run instead of 12, which is the citizenship argument toward a
      # .gov endpoint. It also carries data/raw/'s append-only history forward, and stages
      # /tmp/previous.duckdb for the classifier at the end of this job.
      #
      # PREVIOUS_TAG goes through `env:`, never `${{ }}` spliced into the script text -- same
      # rule as ISSUE_BODY at the bottom of this file. Actions splices `${{ }}` in BEFORE bash
      # parses the script, so a release tagged with a backtick would execute as command
      # substitution in a job holding contents:write + id-token:write + issues:write. The jq
      # shape regex above is the belt; this is the braces.
      - name: Restore previous raw and warehouse
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.tar.zst'
          for f in *.tar.zst; do tar --zstd -xf "$f"; done
          rm -f ./*.tar.zst
          cp upgauge.duckdb /tmp/previous.duckdb
          find data/raw -type f | wc -l

      - name: Ingest and build
        run: |
          set -euo pipefail
          make ingest
          make build

      # Emits all three names. `raw_name` is a separate output on purpose: GitHub Actions
      # expressions do NOT support bash parameter expansion, so `${{ steps.x.outputs.tag#pre }}`
      # would expand to nothing and silently produce a file called `.tar.zst`.
      - id: stamp
        run: |
          set -euo pipefail
          # sql/03_queries/data_as_of.sql already IS this query -- its own header says it
          # exists so nothing needs to inline one. Read and execute it rather than restating it.
          ym=$(mise exec -- uv run python -c "import duckdb; from pathlib import Path; sql = Path('sql/03_queries/data_as_of.sql').read_text(); print(duckdb.connect('upgauge.duckdb', read_only=True).execute(sql).fetchone()[0])")
          # A `make build` that exits 0 against an empty fct_segment_month makes `ym` the
          # string "None" (SQL NULL, printed by Python) -- and the size guard cannot catch
          # this, since the .duckdb stays well over 1MB from schema and dims alone. Refuse to
          # publish rather than mint a `warehouse-None` release that `resolve` could later pick.
          #
          # This regex is also what makes `steps.stamp.outputs.*` the ONLY values in this file
          # still spliced directly into a `run:` body. They are provably [0-9]{4}[-.][0-9]{2}
          # by the time they are written, so there is nothing left for bash to re-parse. Do not
          # generalise that clearance to a value merely checked with `startswith(...)`: a prefix
          # check constrains the prefix and nothing after it, which is exactly why PREVIOUS_TAG
          # and ISSUE_BODY go through `env:` instead.
          [[ "$ym" =~ ^[0-9]{4}-[0-9]{2}$ ]] || { echo "::error::max(year_month) is '$ym', not YYYY-MM -- refusing to publish"; exit 1; }
          dotted=${ym/-/.}
          {
            echo "year_month=$ym"
            echo "tag=warehouse-$dotted"
            echo "raw_name=raw-$dotted"
          } >> "$GITHUB_OUTPUT"

      # LOAD-BEARING FOR THE FRESHNESS ALERT, which is in another file and cannot say so itself.
      # Because this guard skips the publish unless `max(year_month)` advanced, the newest
      # release's `publishedAt` IS the timestamp of the last advance -- which is the whole reason
      # freshness.yml needs no state file. Make this publish on an unchanged month and that
      # derivation quietly degrades into "when did we last run", i.e. healthy forever.
      # See .github/scripts/freshness.py's module docstring.
      - name: Stop if this month is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.stamp.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${{ steps.stamp.outputs.tag }} already published; nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Pack the assets
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          tar --zstd -cf "${{ steps.stamp.outputs.tag }}.tar.zst" upgauge.duckdb data/parquet
          tar --zstd -cf "${{ steps.stamp.outputs.raw_name }}.tar.zst" data/raw
          ls -la ./*.tar.zst
          # Both assets must exist and be non-trivial. A zero-byte tarball published as a
          # release is worse than a failed run: CI would restore it and every gate would fail
          # for an unexplained reason.
          for f in *.tar.zst; do
            size=$(stat -c%s "$f")
            [ "$size" -gt 1000000 ] || { echo "::error::$f is only $size bytes"; exit 1; }
          done

      - name: Attest provenance
        if: env.SKIP != '1'
        # v4, not v1: this workflow is dispatch/cron only, so no PR gate will ever exercise a
        # Dependabot bump here the way one arrives (with a gate) for checkout/mise-action/cache.
        # Bump the actions CI cannot cover now; leave the CI-covered ones to Dependabot.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.tar.zst"

      - name: Publish the release
        id: released
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.stamp.outputs.tag }}" ./*.tar.zst \
            --repo "$GITHUB_REPOSITORY" \
            --title "Warehouse ${{ steps.stamp.outputs.year_month }}" \
            --notes "BTS T-100 warehouse through ${{ steps.stamp.outputs.year_month }}."
          echo "published=1" >> "$GITHUB_OUTPUT"

      # Deliberately AFTER the publish above, not before it: classify is an observability
      # feature, not a release gate. A crash here must never skip "Publish the release" --
      # that would turn a bug in a nice-to-have into a missed monthly release, and the only
      # thing that would notice is the 45-day freshness alert. /tmp/previous.duckdb was
      # restored several steps back ("Restore previous raw and warehouse") and is untouched
      # by packing/attesting/publishing, so nothing about this comparison depends on running
      # earlier, and every `steps.*.outputs` referenced below (`stamp`, `previous`) is still
      # populated at this point in the job regardless of step order.
      - id: classify
        if: steps.previous.outputs.tag != ''
        run: |
          set -euo pipefail
          make stats
          cur=$(cat pipeline/reference/stats.generated.json)
          prev=$(mise exec -- uv run python -c "
          import duckdb, json, sys
          sys.path.insert(0, '.')
          from pipeline.stats import collect
          con = duckdb.connect('/tmp/previous.duckdb', read_only=True)
          print(json.dumps(collect(con)))
          ")
          mise exec -- uv run python .github/scripts/classify_warehouse.py "$prev" "$cur"

      # `issue_body` reaches `gh` through an env var, never spliced into the script text via
      # `${{ }}`. The body contains a markdown code span (`` `make stats` ``) -- live
      # backticks -- and `--body "${{ steps.classify.outputs.issue_body }}"` lets Actions
      # splice that text into the script BEFORE bash parses it, so bash executes the
      # backticks as command substitution before `gh` ever sees the string. `env:` assignment
      # instead sets the process environment directly; `"$ISSUE_BODY"` below is then a plain
      # variable expansion, which bash does not re-parse as source.
      - name: File a critical issue on a shape change
        if: steps.classify.outputs.file_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.classify.outputs.issue_body }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream data shape changed (${{ steps.stamp.outputs.year_month }})" \
            --label critical \
            --body "$ISSUE_BODY"

  # THE BOT HALF OF #74. `WAREHOUSE_TAG` (Makefile) and `app/smoke.sh`'s dataset-pinned needles
  # are one fixture, and nothing moved them together on a cadence: measured, the pin sat on
  # warehouse-2026.04 for four days after the needles had been re-pinned to 2026.05, with every
  # gate green. This opens the PR that moves the pin; `image-contract.yml` is what measures the
  # needles against it.
  #
  # A SEPARATE JOB, not steps appended to `publish`, for two reasons. Permissions are per job,
  # so `pull-requests: write` here never reaches the job that runs `make ingest` against a .gov
  # endpoint while holding contents/id-token/attestations/issues write. And a failure here
  # cannot precede the release -- `publish` has already completed by the time this starts.
  #
  # A FAILURE HERE IS LOUD ALREADY, and that is why there is no watcher of its own: this job
  # failing makes the "Warehouse" run's conclusion `failure`, and scheduled-failure.yml watches
  # "Warehouse" by name -- it files a critical issue, @mentions the owner and assigns them. A
  # second watcher would be the very thing this issue is about.
  bump-pin:
    needs: publish
    # Not `success()`, and not unconditional: "Warehouse" runs DAILY to poll BTS and publishes
    # only when max(year_month) advances, so ~30 runs a month reach this point having published
    # nothing at all. See the `outputs:` comment on the publish job for what sets this.
    if: needs.publish.outputs.published == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege, and every one of the three is load-bearing:
    #   contents      -- push the bump branch
    #   pull-requests -- open the PR and assign it
    #   actions       -- `gh workflow run` the gate (see the dispatch step for why that is not
    #                    optional)
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # `secrets.BUMP_PIN_TOKEN || github.token` -- the repo grants no such secret today and
      # this workflow does not require one. It is written this way so that adding one later is a
      # zero-code change, and because the difference matters: see the dispatch step below.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_PIN_TOKEN || github.token }}

      # No `uv sync`: bump_pin.py is stdlib-only (plus gha.py beside it), so this needs an
      # interpreter and nothing else. mise rather than the runner's python3 keeps it on the same
      # 3.12.12 the tests pinned it against. Same shape as freshness.yml.
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # NEW_TAG reaches the script through `env:`, never spliced via `${{ }}` into the script
      # text -- the rule PREVIOUS_TAG and ISSUE_BODY above spell out. The `stamp` step already
      # proved this value is `warehouse-[0-9]{4}\.[0-9]{2}`, and bump_pin.py re-checks the full
      # anchored shape on its own side: a consumer-side check, the same doubling the tag
      # resolver at the top of this file uses, because a producer's guard is not a thing a
      # consumer should have to depend on staying passed.
      - id: bump
        env:
          NEW_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          mise exec -- python .github/scripts/bump_pin.py "$NEW_TAG"

      # PR_BODY goes through `env:` for the reason the drift-issue step below states: the body
      # carries markdown code spans -- live backticks -- and a spliced `--body "${{ ... }}"`
      # lets bash execute them as command substitution before `gh` ever sees the string.
      - name: Open the pull request
        if: steps.bump.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PIN_TOKEN || github.token }}
          NEW_TAG: ${{ needs.publish.outputs.tag }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          PR_BODY: ${{ steps.bump.outputs.pr_body }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Idempotent across a re-dispatch: an existing branch means the PR was already opened
          # and possibly already worked on by a human re-measuring needles on it. Force-pushing
          # over that would destroy their work; a second PR for the same tag would be noise.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Makefile
          body="WAREHOUSE_TAG and app/smoke.sh's dataset needles are one fixture. This moves"
          body="$body the pin only; the needles are NOT re-measured here. The Image contract"
          body="$body gate is what measures them against this asset."
          git commit -m "Pin the image to ${NEW_TAG}" -m "$body"
          git push origin "$BRANCH"
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "Pin the image to ${NEW_TAG} (was ${PREVIOUS})" \
            --body "$PR_BODY")
          echo "::notice::opened $url"
          echo "### Opened $url" >> "$GITHUB_STEP_SUMMARY"
          # Assignment is delivery polish ON TOP of a PR that already exists and already
          # mentions the owner, so it is deliberately NOT `--assignee` on the create above: a
          # permissions or API hiccup there would fail the CREATE and lose the PR entirely.
          gh pr edit "$url" --add-assignee "$OWNER" \
            || echo "::warning::could not assign $OWNER -- the @mention in the body is the fallback"

      # NOT OPTIONAL, and not belt-and-braces. GitHub starts no new workflow runs from events
      # created by GITHUB_TOKEN -- image.yml's `on:` comment documents the same rule for
      # `release: published`, where it would have made the trigger a permanent silent no-op. So
      # a PR opened by the step above starts NO `pull_request` runs: not ci.yml, and not the one
      # gate that can see the fixture this PR moves. Without this dispatch the bot would emit an
      # ungated PR, which is #74's own defect wearing a different hat.
      #
      # `workflow_dispatch` is the documented exception to that rule, which is why the gate
      # declares it. The PR body carries the branch-filtered link to the run this starts, and
      # says plainly that ci.yml has not run -- a reader who merges on a green-looking PR with
      # no checks is the failure mode here.
      #
      # With a BUMP_PIN_TOKEN secret set, the PR is authored by a real account, every workflow
      # fires normally, and this dispatch becomes a duplicate rather than the only coverage.
      - name: Dispatch the image-contract gate on the bump branch
        if: steps.bump.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.BUMP_PIN_TOKEN || github.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run image-contract.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "::notice::dispatched Image contract on $BRANCH"
