name: Live check

# freshness.py reads the release history; this reads the SERVED SITE. Those are different
# questions, and the gap between them is a real failure mode: a warehouse that published
# correctly and was never promoted leaves the release-based alert green forever while
# DATA AS OF on the page stops advancing. Nothing upstream of the box can see that.
#
# SEPARATE FROM promote.yml on purpose, for the reason freshness.yml's header gives: a check
# that shares a fate with the thing it watches is not a check. promote.yml only runs when a
# human promotes; the site can go wrong on a day nobody deploys.
on:
  # SCHEDULE DISABLED, deliberately and temporarily -- see #77.
  #
  # GitHub Actions runners cannot currently read the live site: every request to
  # `${BASE}/api/health` from a runner comes back as a non-JSON challenge/block page, while the
  # same request from a residential IP with `-A curl/8.0` returns 200 and valid JSON. So this
  # workflow fails on every run for a reason that has nothing to do with the site's health, and
  # `scheduled-failure.yml` files an issue for each failure. An alert that fires every hour
  # regardless of the site is worse than none: it trains its reader to ignore it, which is the
  # exact failure this workflow was built to prevent.
  #
  # `workflow_dispatch` is kept so #77 can be tested against it.
  #
  # RE-ENABLE by restoring the cron below once #77 is resolved. Nothing enforces this -- #77
  # carries the reminder, and the site is unwatched until then.
  #
  # schedule:
  #   - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read   # gh release list
  issues: write    # file the alert

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Fetch AND decide in one step, deliberately. `sitemap` is REMOTE CONTENT fetched from the
      # origin, in a job holding issues:write. A separate "gather" step has nowhere to put
      # `health`/`releases`/`sitemap` except $GITHUB_OUTPUT, and GitHub's own multiline-output
      # convention is a `name<<DELIM ... DELIM` heredoc -- if that DELIM is a static string like
      # `EOF` and the remote content ever contains a line reading exactly `EOF`, the value
      # truncates silently and everything after it is parsed as new key=value output pairs. This
      # repo already solved that for the outputs THIS script writes:
      # `.github/scripts/gha.py`'s `write_multiline_output` randomizes the delimiter per call,
      # and its own docstring names this exact risk. A second, static-delimiter copy of the same
      # multiline-output mechanism in this file's bash would be "two copies of a security
      # property... plus a place for it to be wrong" (gha.py's module docstring). So the fix
      # removes the surface instead of patching it: `health`, `releases` and `sitemap` stay
      # ordinary bash variables from fetch to the script call, in the SAME step, and never touch
      # $GITHUB_OUTPUT at all. test_no_static_delimiter_output_write_of_remote_content pins this
      # shape.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: https://upgauge.shipman.dev
        run: |
          set -euo pipefail

          # HEALTH AND SITEMAP FIRST -- the burst below blocks this IP on /api/ for 60s, and
          # /api/health is under /api/.
          #
          # The STATUS as well as the body. A challenge page, an HTML error page and a 502 are
          # all "not JSON", and live_check.py cannot tell them apart -- or let an operator tell
          # them apart from the alert alone -- without the code. `-o` to a file truncated first,
          # so a fetch that fails part-way can never be read as whatever was there before, and
          # `|| echo 000` because a curl that never gets a response line has no code to report.
          # 8000 bytes is far above any real report (~150) and bounds what a hostile or broken
          # origin can put into argv.
          # NOT `$(curl ... || echo 000)`: curl writes its `-w` output even when the transfer
          # fails, so the fallback CONCATENATES onto it. Measured with curl 8.18.0: `000000` on
          # a refused connection, `200000` when --max-time expires mid-body. Assign instead.
          : > /tmp/health.body
          if ! hcode=$(curl -sS -o /tmp/health.body -w '%{http_code}' --max-time 15 \
                       "${BASE}/api/health"); then
            hcode=000
          fi
          health=$(head -c 8000 /tmp/health.body)
          sitemap=$(curl -sS --max-time 15 "${BASE}/sitemap.xml" | head -c 2000 || echo "")

          # Two fetches of the SAME url: the first may legitimately miss (cold edge, or the
          # entry just expired). Only the second says whether the edge is caching HTML at all.
          #
          # The second fetch is NOT a bare pipeline. Under `set -euo pipefail` a curl that
          # cannot reach the origin makes the whole pipeline non-zero, the assignment aborts the
          # STEP, and live_check.py never runs -- no verdict, no `file_issue`, no issue, on
          # exactly the condition this alert exists to report. Measured against a dead port:
          # the step exits 7 and $GITHUB_OUTPUT is never written. So curl is gated on its own
          # exit status and the header parse happens afterwards, on a value already in hand.
          curl -sS -o /dev/null --max-time 15 "${BASE}/watch" || true
          cf=absent
          if headers=$(curl -sS -o /dev/null -D - --max-time 15 "${BASE}/watch"); then
            cf=$(printf '%s' "$headers" | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="cf-cache-status"{print $2}')
            cf="${cf:-absent}"
          fi

          releases=""
          for attempt in 1 2 3 4 5; do
            if releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                            --exclude-drafts --exclude-pre-releases \
                            --json tagName,publishedAt); then
              break
            fi
            echo "::warning::gh release list failed (attempt $attempt of 5); retrying"
            releases=""
            sleep $((attempt * 5))
          done
          # NEVER let a failed listing through as empty: `[]` is an answer, an empty STRING is
          # an outage, and passing it on would report "no newer release" -- a false green on
          # the one check nothing else can make.
          [ -n "$releases" ] || {
            echo "::error::could not list releases after 5 attempts -- refusing to judge against no data"
            exit 1
          }

          # LAST. 80 requests against a 60/min limit, so the tail must be blocked. The rule
          # matches the /api/ prefix, so this exercises the same rule that protects /api/pivot.
          rl=0
          for _ in $(seq 1 80); do
            # Same concatenation trap as the health fetch above.
            if ! rl=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                      "${BASE}/api/pivot?v=1&k=seg&d=op_airline_id&m=seats&t=2025-05:2026-04&n=5&g=op"); then
              rl=000
            fi
            [ "$rl" = "429" ] && break
          done

          # health/releases/sitemap are LOCAL SHELL VARIABLES, passed as quoted argv -- never
          # written to $GITHUB_OUTPUT, and never substituted into this script's text via an
          # Actions expression either (the rule warehouse.yml's PREVIOUS_TAG comment spells
          # out, extended here to the output-file surface as well as the run: scalar surface).
          # live_check.py's own outputs (file_issue, issue_body) DO cross a step boundary
          # below, through gha.write_multiline_output's randomized delimiter, which is what
          # makes that half safe without a matching fix.
          mise exec -- python .github/scripts/live_check.py \
            "$health" "$hcode" "$releases" "$sitemap" "$cf" "$rl"

      # A failing live check is a CONDITION, not an event: it stays true every hour until
      # someone fixes it. Without this, one bad afternoon files a dozen issues and the alert
      # gets muted -- freshness.yml's own reasoning, at 24x the rate.
      - id: existing
        if: steps.check.outputs.file_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --label live-red --json number --jq 'length')
          echo "count=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "::notice::a live-red alert is already open; not filing another"

      # `live-red` must EXIST on the repository -- `gh issue create` fails outright on an
      # unknown label, which turns the alert into a failed run whose only symptom is a red tick
      # nobody watches. Create it once (Step 6 of this task).
      - name: File the live-check alert
        if: steps.check.outputs.file_issue == '1' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.check.outputs.issue_body }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n\n%s' "@$OWNER" "$ISSUE_BODY")
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "The served site failed a post-deploy check" \
            --label critical --label live-red \
            --body "$body")
          echo "::notice::filed $url"
          # Create first, assign second: a permissions hiccup on --assignee would fail the
          # CREATE and lose the alert entirely. The @mention in the body is the fallback.
          gh issue edit "$url" --add-assignee "$OWNER" \
            || echo "::warning::could not assign $OWNER -- the @mention in the body is the fallback"
